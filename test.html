<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pitch Count Viewer</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .pitcher-block { 
            margin-top: 10px; 
            padding: 10px; 
            border: 1px solid #ddd; 
            background: #f0f0f0; 
        }
        #hiddenDom { display: none; }
    </style>
</head>
<body>

<h2>Pitch Counts</h2>

<div id="pitchers">Loading…</div>

<!-- Hidden DOM container for parsing -->
<div id="hiddenDom"></div>

<script>
// Auto-run on page load
window.onload = async () => {
    const html = await fetchHtml("/api/box-score");
    parseDom(html);
};

async function fetchHtml(endpoint) {
    const res = await fetch(endpoint);
    return await res.text();
}

// Extract pitch counts using full-text scan
function extractPitchCounts() {
    const hidden = document.getElementById("hiddenDom");
    const text = hidden.innerText; // innerText works better for GC

    const results = [];

    // Matches: "A Woolner 64-38" or "G Sigfried #25 60-36"
    const regex = /([A-Z][a-z]+(?: [A-Z][a-z]+)?)\s*(?:#\d+)?\s+(\d+)-(\d+)/g;
    let match;

    while ((match = regex.exec(text)) !== null) {
        results.push({
            name: match[1],
            pitches: parseInt(match[2]),
            strikes: parseInt(match[3]),
            strikePct: ((parseInt(match[3]) / parseInt(match[2])) * 100).toFixed(1)
        });
    }

    return results;
}

function renderPitchCounts(pitchers) {
    const container = document.getElementById("pitchers");
    container.innerHTML = "";

    if (pitchers.length === 0) {
        container.innerHTML = "No pitch count data found.";
        return;
    }

    pitchers.forEach(p => {
        const div = document.createElement("div");
        div.className = "pitcher-block";
        div.innerHTML = `
            <strong>${p.name}</strong><br>
            Pitches: ${p.pitches}<br>
            Strikes: ${p.strikes}<br>
            Strike %: ${p.strikePct}%
        `;
        container.appendChild(div);
    });
}

function parseDom(html) {
    const hidden = document.getElementById("hiddenDom");
    hidden.innerHTML = html;

    const pitchCounts = extractPitchCounts();
    renderPitchCounts(pitchCounts);
}
</script>

</body>
</html>
